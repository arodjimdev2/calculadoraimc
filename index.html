<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora IMC</title>
        <script src="js/calculadora.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
        <h1>Calculadora IMC</h1>
        </header>
        <main>
        <div>
            <div class="form">

                <label for="txtPeso">Peso </label><br>
                <input type="text" placeholder="Inserta tu peso en Kg" id="txtPeso">
                <br><br>
                <label for="txtAltura">Altura </label><br>
                <input type="text" placeholder="En M(Decimales con punto)" id="txtAltura">
                
                <br><br>
                <img src="img/imc.jpg" alt="Indice IMC">
                <br> <br>
                <input type="submit" value="Calcular" id="btnCalcular" class="botoncillo" >
                <br><br>
                <div id="resultadoImc"> </div>
            </div>
        </div>
        </main>
        <footer>Hola, soy un footer y hace mucho tiempo que no me paso por aquí. Un saludo a Moreno Bonilla | 2025 © Todas las faltadas están reservadas.</footer>
    </body>
</html>
